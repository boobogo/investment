[project]
name = "investment"
version = "0.1.0"
description = "Market watcher: alerts on unusual moves in the main markets, and Claude-written news digests"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.0.6",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "yfinance>=1.7.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
