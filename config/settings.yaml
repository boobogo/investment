# Market watcher settings. Relative paths resolve against the project root.

paths:
  state: data/state.json      # the watcher's small memory (no database; prices are never stored)
  prompts: prompts

watch:
  # What the watcher checks for unusual moves: {group: {Yahoo Finance symbol: short name}}.
  # Futures and currencies trade almost around the clock, so they also catch overnight news.
  instruments:
    US stocks:
      ES=F: S&P 500 fut
      NQ=F: Nasdaq 100 fut
      YM=F: Dow (US30) fut
      RTY=F: Russell 2000 fut
      ^VIX: VIX
    US sectors:
      SMH: Chips (SMH)
      XLF: Banks (XLF)
      XLE: Energy (XLE)
      XLV: Health care (XLV)
    Rates and currencies:
      ^TNX: US 10y yield
      DX-Y.NYB: Dollar index
      EURUSD=X: EUR/USD
      JPY=X: USD/JPY
    Commodities:
      GC=F: Gold
      CL=F: WTI oil
      BZ=F: Brent oil
    Europe:
      ^STOXX50E: Euro Stoxx 50
      ^GDAXI: DAX
      ^FTSE: FTSE 100
    Asia:
      ^N225: Nikkei 225
      ^HSI: Hang Seng
      000001.SS: Shanghai
      ^KS11: KOSPI
    Crypto:
      BTC-USD: Bitcoin
  check_minutes_open: 15      # how often prices are checked while European or US stock markets are open ...
  check_minutes_closed: 30    # ... and the rest of the time (nights, weekends)
  market_hours:               # "open" above: Xetra and the New York Stock Exchange, weekdays
    - {start: "09:00", end: "17:30", timezone: Europe/Berlin, days: [mon, tue, wed, thu, fri]}
    - {start: "09:30", end: "16:00", timezone: America/New_York, days: [mon, tue, wed, thu, fri]}
  max_quote_age_minutes: 45   # an instrument whose last price is older is closed now: shown, never alerted on
  sigma_days: 250             # typical daily move = standard deviation of daily changes over this many sessions

alerts:
  # A move is "unusual" when it is several times the instrument's typical daily move (sigma), so
  # quiet instruments (S&P, EUR/USD) alert on smaller % moves than jumpy ones (oil, VIX, bitcoin).
  mode: live                  # shadow = record what would be sent; live = send to Telegram
  # Replaying Aug-Oct 2026 with these values: ~5 alerts a week (the Oct 22 AI sell-off, the Oct 15 Asia drop, oil spikes...)
  day_sigma: 2.5              # over the last 24 hours: at least this many typical daily moves (S&P ~2%, oil ~8%)
  hour_sigma: 2.0             # within the last hour: at least this many typical daily moves (S&P ~1.6%)
  critical_day_sigma: 4.0     # this big on a critical symbol: comes through quiet hours and /mute (S&P ~3.2%)
  critical_hour_sigma: 3.0    # (S&P ~2.4% within an hour)
  critical_symbols: [ES=F, NQ=F, YM=F, RTY=F, ^VIX, CL=F, BZ=F, GC=F]
  repeat_hours_day: 20        # the same instrument and direction alerts again only after this many hours ...
  repeat_hours_hour: 3
  escalation: 1.5             # ... or sooner if the move grows this many times bigger
  context: [ES=F, NQ=F, ^VIX, CL=F, GC=F, BTC-USD]   # shown under each alert for the bigger picture
  quiet_hours: {start: "23:00", end: "07:00", timezone: Europe/Prague}   # held alerts go into the morning digest
  daily_budget: 6             # after this many alert messages in a (Prague) day, only critical ones go out

claude:
  # Claude with web search writes the digests and explains big moves (the `claude` CLI on the Pro plan)
  model: claude-sonnet-5-5    # switch to claude-opus-5-5 here
  effort: high                # low | medium | high | xhigh | max
  timeout_s: 600              # a call with web searches takes 1-4 minutes
  retries: 1                  # one more attempt after a transient failure ...
  backoff_s: [60]             # ... after waiting this long
  daily_calls: 4              # all Claude calls in a (Prague) day; scheduled digests are reserved first,
                              # so on weekdays 2 are left for explaining big moves (or /digest)
  explain_min_gap_minutes: 120          # one explanation per burst: later alerts within this window don't call again
  explain_skip_before_digest_minutes: 45   # a digest that is this close covers the move instead

digests:
  # Each time is in its own time zone, so daylight-saving changes on either side need no edits.
  morning: {time: "07:30", timezone: Europe/Prague, days: [mon, tue, wed, thu, fri]}     # US close, Asia, overnight
  preopen: {time: "09:00", timezone: America/New_York, days: [mon, tue, wed, thu, fri]}  # Europe, US data, pre-market
  weekly:  {time: "19:00", timezone: Europe/Prague, days: [sun]}                          # the week behind and ahead
  follow: [AAPL, MSFT, NVDA, AMZN, GOOGL, JPM, XOM, JNJ, CAT, KO]   # stocks whose material news always makes the digest
  timezone: Europe/Prague     # times in the digests are shown in this zone

telegram:
  timeout_s: 20               # bot token and chat id come from .env: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
